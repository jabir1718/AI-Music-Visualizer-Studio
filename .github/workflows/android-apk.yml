name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'professional-studio.css'
      - 'studio-shell.js'
      - 'option-preview.js'
      - 'app.js'
      - 'audio-engine.js'
      - 'bpm-engine.js'
      - 'export.js'
      - 'lyrics-engine.js'
      - 'project-file.js'
      - 'image-search.js'
      - 'filter-studio.js'
      - 'typography-studio.js'
      - 'timeline-engine.js'
      - 'timeline-view.js'
      - 'history-engine.js'
      - 'keyframe-engine.js'
      - 'chroma-key.js'
      - 'ai-segmentation.js'
      - 'audio-cleanup.js'
      - 'voice-recorder.js'
      - 'symbol-library.js'
      - 'three-studio.js'
      - 'video-audio-extractor.js'
      - 'sound-library.js'
      - 'artwork-layers.js'
      - 'auto-video-editor.js'
      - 'offline-edit-assistant.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        run: node --check studio-shell.js && node --check option-preview.js && node --check app.js && node --check lyrics-engine.js && node --check audio-engine.js && node --check bpm-engine.js && node --check export.js && node --check project-file.js && node --check image-search.js && node --check filter-studio.js && node --check chroma-key.js && node --check ai-segmentation.js && node --check audio-cleanup.js && node --check voice-recorder.js && node --check symbol-library.js && node --check three-studio.js && node --check video-audio-extractor.js && node --check sound-library.js && node --check artwork-layers.js && node --check auto-video-editor.js && node --check offline-edit-assistant.js && node --check typography-studio.js && node --check timeline-engine.js && node --check timeline-view.js && node --check history-engine.js && node --check keyframe-engine.js

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Run audio engine tests
        run: npm test

      - name: Prepare web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Add microphone permission for local recording
        run: node scripts/patch-android-manifest.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveForge-Studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
